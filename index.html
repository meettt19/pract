<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematics Practicals</title><style>
:root{color-scheme:dark;--bg:#292929;--panel:#333;--card:#414141;--line:#5a5a5a;--text:#f5f5f5;--muted:#bcbcbc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:38px auto;padding:0 22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 4px 14px #0004}h1{font-size:28px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 22px;line-height:1.5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input{flex:1;min-width:210px;background:#242424;color:white;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px}button{cursor:pointer;border:1px solid var(--line);background:#484848;color:white;border-radius:8px;padding:10px 14px;font-size:14px}button:hover,.item:hover{background:#555}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.item{text-align:left;min-height:92px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 3px 9px #0003;width:100%}.item strong{display:block;font-size:16px;margin-bottom:8px}.item span{font-size:13px;color:var(--muted);line-height:1.45}.viewer{display:none;margin-top:20px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.head h2{font-size:20px;margin:0}.codebox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#171717}.meta{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:#222;color:var(--muted);font-size:12px}pre{margin:0;padding:18px;overflow:auto;max-height:65vh;line-height:1.55;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}code{font-family:Consolas,monospace}.empty{color:var(--muted);display:none}@media(max-width:600px){.wrap{margin:18px auto;padding:0 12px}.panel{padding:16px}h1{font-size:23px}}</style></head><body><main class="wrap"><section class="panel"><h1>MATHEMATICS PRACTICALS</h1><p class="sub">Only the latest Mathematics practical files are included. Select a practical to view and copy its Python code.</p><div class="toolbar" id="searchWrap"><input id="search" type="search" placeholder="Search practicals..."></div><div id="list" class="grid"></div><p id="empty" class="empty">No practicals match your search.</p><section id="viewer" class="viewer"><div class="head"><h2 id="title">Source Code</h2><div class="toolbar" style="margin:0"><button id="back">← All practicals</button><button id="copy">Copy Code</button></div></div><div class="codebox"><div class="meta"><span id="filename"></span><span id="lines"></span></div><pre><code id="code"></code></pre></div></section></section></main><script>
const practicals=[{"file": "P1A_Divisibility.py", "title": "P1 (A) — Check Divisibility", "subject": "Mathematics", "code": "a = int(input(\"Enter first integer: \")) #6\nb = int(input(\"Enter second integer: \")) #2\n\nif b != 0:\n    if a % b == 0:\n        print(a, \"is divisible by\", b)\n    else:\n        print(a, \"is not divisible by\", b)\n\nelse:\n    print(\"Division by Zero is not allowed\")\n"}, {"file": "P1B_Divisors.py", "title": "P1 (B) — Find Divisors", "subject": "Mathematics", "code": "n = int(input(\"Enter a positive integer: \")) #6\n\nprint(\"Divisor of\", n, \"are:\")\n\nfor i in range(1, n + 1):\n    if n % i == 0:\n        print(i, end=\" \")\n"}, {"file": "P1C_LCM.py", "title": "P1 (C) — Find LCM", "subject": "Mathematics", "code": "a = int(input(\"Enter first integer: \")) #6\nb = int(input(\"Enter second integer: \")) #2\n\nx = a\ny = b\nwhile y != 0:\n    x, y = y, x % y\n\ngcd = abs(x)\n\nif a == 0 or b == 0:\n    lcm = 0\nelse:\n    lcm = abs(a * b)\nprint(\"LCM =\", lcm)\n"}, {"file": "P1D_Primes.py", "title": "P1 (D) — Prime Numbers", "subject": "Mathematics", "code": "n = int(input(\"Enter the value of N: \"))#6\n\nprint(\"Prime numbers are\")\n\nfor num in range(2, n + 1):\n    prime = True\n\n    for i in range(2, int(num * 0.5) + 1):\n        if num % i == 0:\n            prime = False\n            break\n    if prime:\n        print(num, end=\" \")\n"}, {"file": "P1E_CommonDivisors.py", "title": "P1 (E) — Common Divisors", "subject": "Mathematics", "code": "a = int(input(\"Enter first integer: \")) #6\nb = int(input(\"Enter second integer: \")) #2\n\nprint(\"Common Divisors are:\")\n\nfor i in range(1, min(abs(a), abs(b)) + 1):\n    if a % i == 0 and b % i == 0:\n        print(i, end=\" \")\n"}, {"file": "P2_EuclidsGCD.py", "title": "P2 — GCD Using Euclid's Algorithm", "subject": "Mathematics", "code": "# Program to find GCD using Euclid's Algorithm\n\na = int(input(\"Enter first integer: \"))#48\nb = int(input(\"Enter second integer: \"))#18\n\nwhile b != 0:\n    remainder = a % b\n    a = b\n    b = remainder\n\nprint(\"GCD =\", abs(a))#6\n"}, {"file": "P3_Congruence.py", "title": "P3 — Properties of Congruence", "subject": "Mathematics", "code": "# Properties of Congruence\n\na = int(input(\"Enter a: \")) #17\nb = int(input(\"Enter b: \")) #5\nc = int(input(\"Enter c: \")) #29\nm = int(input(\"Enter modulus: \")) #12\n\nprint(\"\\n--- Properties of Congruence ---\")\n\n#Reflexive\nif (a - a) % m == 0:\n    print(\"1. Reflexive property: True\")\n\n#Symmetric\nif (a - a) % m == 0:\n    print(\"2. Symmetric property: True\")\n    \n#Transitive\nif (a - a) % m == 0 and (b - c) % m == 0:\n   print(\"3. Transitive property: True\")\n\n#Addition\nif (a - b) % m == 0 :\n    if (a + c -(b + c)) % m == 0:\n        print(\"4. Addition property: True\")\n\n#Subtraction\nif (a - b) % m == 0 :\n    if (a - c -(b - c)) % m == 0:\n        print(\"5. Subtraction property: True\")\n\n#Multiplication\nif (a - b) % m == 0 :\n    if (a * c - b * c) % m == 0:\n        print(\"6. Multiplication property: True\")\n\n#Power\nn = int(input(\"Enter power n: \")) #2\n\nif (a - b) % m == 0 :\n    if (a ** n - b ** n) % m == 0:\n        print(\"7. Power property: True\")\n"}, {"file": "P4A_ModuloSolutions.py", "title": "P4 (A) — Modulo Solutions", "subject": "Mathematics", "code": "import math\n\na = int(input(\"Enter a: \"))#5\nb = int(input(\"Enter b: \"))#7\nm = int(input(\"Enter modulus m: \"))#12\n\nsolutions = []\n\nfor x in range(m):\n    if (a * x - b) % m == 0:\n        solutions.append(x)\n\nif len(solutions) == 0:\n    print(\"No solution exists.\")\nelse:\n    print(\"Solutions modulo\", m, \"are:\", solutions)\n"}, {"file": "P4B_ModularInverse.py", "title": "P4 (B) — Modular Inverse", "subject": "Mathematics", "code": "import math\n\na = int(input(\"Enter a: \"))#5\nb = int(input(\"Enter b: \"))#7\nm = int(input(\"Enter modulus m: \"))#12\n\ng = math.gcd(a, m)\n\nif g != 1:\n    print(\"GCD(a, m) =\", g)\n    print(\"Since GCD is not 1, modular inverse does not exist.\")\nelse:\n    inverse = pow(a, -1, m)\n    x = (inverse * b) % m\n\n    print(\"GCD(a, m) =\", g)\n    print(\"Multiplicative inverse of\", a, \"modulo\", m, \"=\", inverse)\n    print(\"Solution: x =\", x)\n"}, {"file": "P5A_ArgandPlane.py", "title": "P5 (A) — Complex Number on Argand Plane", "subject": "Mathematics", "code": "import matplotlib.pyplot as plt\n\nx = float(input(\"Enter real part \"))\ny = float(input(\"Enter imaginary part \"))\n\nplt.axhline(0)\nplt.axvline(0)\n\nplt.scatter(x, y)\nplt.plot([0, x], [0, y], linestyle=\"--\")\n\nplt.xlabel(\"Real Axis\")\nplt.ylabel(\"Imaginary Axis\")\nplt.title(\"Complex Number on Agrand Plane\")\nplt.grid()\n\nplt.show()\n"}, {"file": "P5B_CartesianToPolar.py", "title": "P5 (B) — Cartesian to Polar Form", "subject": "Mathematics", "code": "#Practical 5b: Convert Complex Number from Cartesian Form to Polar Form\n\nimport cmath\nimport math\n\nx = float(input(\"Enter real part:\"))\ny = float(input(\"Enter imaginary part:\"))\n\nz = complex(x,y)\n\nr, theta = cmath.polar(z)\n\ntheta_degree = math.degrees(theta)\n\nprint(\"Complex number =\", z)\nprint(\"Modulus (r) =\",r)\nprint(\"Argument (theta) in radians =\", theta)\nprint(\"Argument (theta) in degrees =\", theta_degree)\n\nprint(\"\\nPolar form:\")\nprint(f\"{r:.2}(cos({theta_degree:.2f}°) + i sin({theta_degree:.2f}°))\")\n"}, {"file": "P6_DeMoivre.py", "title": "P6 — Applications of De Moivre’s Theorem", "subject": "Mathematics", "code": "import cmath\nimport math\n\na = float(input(\"Enter real part: \"))\nb = float(input(\"Enter imaginary part: \"))\nn = float(input(\"Enter power n: \"))\n\nz = complex(a, b)\n\nr = abs(z)\ntheta = cmath.phase(z)\n\n# De Moivre's theorem\nresult = (r ** n) * (\n    math.cos(n * theta) + 1j * math.sin(n * theta)\n)\n\nprint(\"\\nComplex number z =\",z)\nprint(\"Modulus r =\", r)\nprint(\"Argument theta =\", math.degrees(theta), \"degrees\")\n\nprint(\"\\nUsing De Moivre's theorem:\")\nprint(\"z^n =\", result)\n\nprint(\"\\nDirect Python calculation:\")\nprint(\"z^n =\", z ** n)\n"}, {"file": "P7A_ArithmeticSequence.py", "title": "P7 (A) — Arithmetic Sequence", "subject": "Mathematics", "code": "import matplotlib.pyplot as plt\n\n# First term and common difference\na = 2\nd = 3\nn = 10\n\nsequence = []\n\nfor i in range(n):\n    term = a + i * d\n    sequence.append(term)\n\nprint(\"Arithmetic Sequence:\")\nprint(sequence)\n\n# Plot\nplt.plot(range(1, n + 1), sequence, marker='o')\nplt.xlabel(\"n\")\nplt.ylabel(\"a(n)\")\nplt.title(\"Arithmetic Sequence\")\nplt.grid()\nplt.show()\n"}, {"file": "P7B_NaturalSequence.py", "title": "P7 (B) — Natural Number Sequence", "subject": "Mathematics", "code": "import matplotlib.pyplot as plt\n\nn = 10\n\nsequence = list(range(1, n + 1))\n\nprint(\"Natural Number Sequence:\")\nprint(sequence)\n\n# Plot\nplt.plot(range(1, n + 1), sequence, marker='o')\nplt.xlabel(\"n\")\nplt.ylabel(\"a(n)\")\nplt.title(\"Natural Number Sequence\")\nplt.grid()\nplt.show()\n"}, {"file": "P7C_SquareSequencePlot.py", "title": "P7 (C) — Sequence of Squares", "subject": "Mathematics", "code": "import matplotlib.pyplot as plt\n\nn = 10\n\nsequence = []\n\nfor i in range(1, n + 1):\n    sequence.append(i ** 2)\n\nprint(\"Square Sequence:\")\nprint(sequence)\n\nplt.plot(range(1, n + 1), sequence, marker='o')\nplt.xlabel(\"n\")\nplt.ylabel(\"n\")\nplt.title(\"Sequence of Square\")\nplt.grid()\nplt.show()\n"}, {"file": "P7D_SquareSequenceBar.py", "title": "P7 (D) — Square Sequence", "subject": "Mathematics", "code": "import matplotlib.pyplot as plt\n\nn = 10\nsequence = [i ** 2 for i in range (1, n + 1)]\n\nprint(\"Square Sequence:\")\nprint(sequence)\n\nplt.bar(range(1, n + 1), sequence)\nplt.xlabel(\"n\")\nplt.ylabel(\"n²\")\nplt.title(\"Square Sequence\")\nplt.show()\n"}, {"file": "P7E_Convergence.py", "title": "P7 (E) — Convergence of a(n) = 1/n", "subject": "Mathematics", "code": "import matplotlib.pyplot as plt\n\nn = range(1, 101)\n\nsequence = [1/i for i in n]\n\nprint(\"First 10 terms:\")\nprint(sequence[:10])\n\nplt.plot(n, sequence, marker='o')\nplt.axhline(y=0, linestyle='--')\nplt.xlabel(\"n\")\nplt.ylabel(\"a(n)\")\nplt.title(\"Convergence of Sequence a(n) = 1/n\")\nplt.grid()\nplt.show()\n"}];const list=document.getElementById('list'),search=document.getElementById('search'),viewer=document.getElementById('viewer'),code=document.getElementById('code');let active=null;
function render(){let q=search.value.trim().toLowerCase(),arr=practicals.filter(p=>(p.file+' '+p.title).toLowerCase().includes(q));list.innerHTML='';document.getElementById('empty').style.display=arr.length?'none':'block';arr.forEach(p=>{let b=document.createElement('button');b.className='item';let s=document.createElement('strong');s.textContent=p.file;let t=document.createElement('span');t.textContent=p.subject+' · '+p.title;b.append(s,t);b.onclick=()=>show(p);list.appendChild(b)})}
function show(p){active=p;document.getElementById('title').textContent=p.title;document.getElementById('filename').textContent=p.file;code.textContent=p.code;document.getElementById('lines').textContent=p.code.split('\\n').length+' lines';viewer.style.display='block';list.style.display='none';document.getElementById('searchWrap').style.display='none';viewer.scrollIntoView({behavior:'smooth'})}
function back(){viewer.style.display='none';list.style.display='grid';document.getElementById('searchWrap').style.display='flex';render()}
search.oninput=render;document.getElementById('back').onclick=back;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(active.code);document.getElementById('copy').textContent='Copied!'}catch(e){document.getElementById('copy').textContent='Clipboard unavailable'}};render();
</script></body></html>
