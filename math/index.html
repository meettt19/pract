
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathematics Practicals | Code Library</title>

<style>
:root {
    color-scheme: dark;
    --bg: #292929;
    --panel: #333;
    --card: #414141;
    --line: #5a5a5a;
    --text: #f5f5f5;
    --muted: #bcbcbc;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: 38px auto;
    padding: 0 22px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 4px 14px #0004;
}

h1 {
    font-size: 28px;
    margin: 0 0 8px;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 22px;
}

.search-box {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #242424;
    color: white;
    font-size: 15px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
}

.item {
    text-align: left;
    min-height: 92px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    color: white;
    cursor: pointer;
    width: 100%;
}

.item:hover {
    background: #555;
}

.item strong {
    display: block;
    font-size: 15px;
    margin-bottom: 9px;
}

.item span {
    font-size: 13px;
    color: var(--muted);
}

.viewer {
    display: none;
    margin-top: 20px;
}

.viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.viewer-header h2 {
    font-size: 20px;
}

button.action {
    padding: 10px 15px;
    background: #484848;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

button.action:hover {
    background: #606060;
}

.codebox {
    background: #171717;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
}

.code-meta {
    display: flex;
    justify-content: space-between;
    padding: 12px 15px;
    background: #222;
    color: var(--muted);
    font-size: 12px;
}

pre {
    margin: 0;
    padding: 18px;
    overflow: auto;
    max-height: 65vh;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

code {
    font-family: Consolas, monospace;
}

.empty {
    display: none;
    color: var(--muted);
    padding: 15px 0;
}

@media(max-width:600px) {
    .container {
        margin: 18px auto;
        padding: 0 12px;
    }

    .panel {
        padding: 16px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">
<section class="panel">

    <h1>MATHEMATICS PRACTICALS</h1>

    <p class="subtitle">
        Select a practical to view and copy its complete Python code.
    </p>

    <input
        type="search"
        id="search"
        class="search-box"
        placeholder="Search practicals..."
    >

    <div id="list" class="grid"></div>

    <p id="empty" class="empty">
        No practicals found.
    </p>

    <section id="viewer" class="viewer">

        <div class="viewer-header">
            <h2 id="codeTitle">Source Code</h2>

            <div>
                <button class="action" id="backBtn">
                    ← All Practicals
                </button>

                <button class="action" id="copyBtn">
                    Copy Code
                </button>
            </div>
        </div>

        <div class="codebox">

            <div class="code-meta">
                <span id="fileName"></span>
                <span id="lineCount"></span>
            </div>

            <pre><code id="code"></code></pre>

        </div>

    </section>

</section>
</div>

<script>

// All Mathematics practicals
const practicals = [

{
    file: "P1A_Divisibility.py",
    title: "P1 (A) — Check Divisibility"
},
{
    file: "P1B_Divisors.py",
    title: "P1 (B) — Find Divisors"
},
{
    file: "P1C_LCM.py",
    title: "P1 (C) — Find LCM"
},
{
    file: "P1D_Primes.py",
    title: "P1 (D) — Prime Numbers"
},
{
    file: "P1E_CommonDivisors.py",
    title: "P1 (E) — Common Divisors"
},
{
    file: "P2_EuclidsGCD.py",
    title: "P2 — GCD Using Euclid's Algorithm"
},
{
    file: "P3_Congruence.py",
    title: "P3 — Properties of Congruence"
},
{
    file: "P4A_ModuloSolutions.py",
    title: "P4 (A) — Modulo Solutions"
},
{
    file: "P4B_ModularInverse.py",
    title: "P4 (B) — Modular Inverse"
},
{
    file: "P5A_ArgandPlane.py",
    title: "P5 (A) — Argand Plane"
},
{
    file: "P5B_CartesianToPolar.py",
    title: "P5 (B) — Cartesian to Polar Form"
},
{
    file: "P6_DeMoivre.py",
    title: "P6 — De Moivre's Theorem"
},
{
    file: "P7A_ArithmeticSequence.py",
    title: "P7 (A) — Arithmetic Sequence"
},
{
    file: "P7B_NaturalSequence.py",
    title: "P7 (B) — Natural Number Sequence"
},
{
    file: "P7C_SquareSequencePlot.py",
    title: "P7 (C) — Sequence of Squares"
},
{
    file: "P7D_SquareSequenceBar.py",
    title: "P7 (D) — Square Sequence"
},
{
    file: "P7E_Convergence.py",
    title: "P7 (E) — Convergence of a(n) = 1/n"
}

];

const list = document.getElementById("list");
const search = document.getElementById("search");
const viewer = document.getElementById("viewer");
const codeElement = document.getElementById("code");

let activePractical = null;

// Display practical list
function renderList() {

    const query = search.value.toLowerCase();

    const filtered = practicals.filter(p =>
        (p.file + " " + p.title)
        .toLowerCase()
        .includes(query)
    );

    list.innerHTML = "";

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";

    filtered.forEach(p => {

        const button = document.createElement("button");
        button.className = "item";

        const filename = document.createElement("strong");
        filename.textContent = p.file;

        const title = document.createElement("span");
        title.textContent = "Mathematics · " + p.title;

        button.append(filename, title);

        button.addEventListener("click", () => {
            showCode(p);
        });

        list.appendChild(button);

    });

}

// Load and display code
async function showCode(p) {

    activePractical = p;

    document.getElementById("codeTitle").textContent = p.title;
    document.getElementById("fileName").textContent = p.file;

    codeElement.textContent = "Loading code...";

    viewer.style.display = "block";
    list.style.display = "none";
    search.style.display = "none";

    viewer.scrollIntoView({ behavior: "smooth" });

    try {

        const response = await fetch(
            "./code/" + encodeURIComponent(p.file)
        );

        if (!response.ok) {
            throw new Error("File not found");
        }

        const sourceCode = await response.text();

        if (activePractical !== p) return;

        codeElement.textContent = sourceCode;

        document.getElementById("lineCount").textContent =
            sourceCode.split("\n").length + " lines";

    } catch (error) {

        codeElement.textContent =
            "Unable to load code. Please check whether the Python file exists in the code folder.";

        document.getElementById("lineCount").textContent = "Error";

    }

}

// Back button
function showList() {

    viewer.style.display = "none";
    list.style.display = "grid";
    search.style.display = "block";

    renderList();

}

// Search
search.addEventListener("input", renderList);

// Back
document.getElementById("backBtn")
    .addEventListener("click", showList);

// Copy code
document.getElementById("copyBtn")
    .addEventListener("click", async () => {

        if (!activePractical) return;

        const button = document.getElementById("copyBtn");

        try {

            await navigator.clipboard.writeText(
                codeElement.textContent
            );

            button.textContent = "Copied!";

            setTimeout(() => {
                button.textContent = "Copy Code";
            }, 1500);

        } catch (error) {

            button.textContent = "Copy unavailable";

        }

    });

// Start website
renderList();

</script>

</body>
</html>
